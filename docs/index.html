<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设计青年圆桌派资源收集系统</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#151515;font-family:Arial,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(920px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.logo{width:190px;height:auto}.tag{font-size:12px;font-weight:800;color:#8c7000}.hero{padding:9vh 0 48px}.hero h1{font-size:clamp(38px,7vw,76px);line-height:1.02;margin:16px 0;letter-spacing:0}.hero p{max-width:600px;color:#555;line-height:1.8}.notice{border-left:5px solid #ffd400;background:#fff8cc;padding:14px 16px;margin:28px 0;font-size:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{border:1px solid #ddd;background:#fff;padding:28px;text-align:left}.choice:hover{border-color:#111}.choice b{display:block;font-size:23px;margin-bottom:8px}.choice span{color:#666}.form{display:none;padding-bottom:50px}.back{border:0;background:none;padding:0;color:#555}.head{display:flex;justify-content:space-between;align-items:end;margin:32px 0 14px}.head h1{font-size:28px;margin:7px 0 0}.progress{height:4px;background:#ddd;margin-bottom:24px}.bar{height:100%;background:#ffd400;transition:.2s}.panel{border:1px solid #ddd;background:#fff;padding:28px;min-height:420px}.panel h2{margin:0 0 24px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:block;font-size:14px;font-weight:700}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #ccc;background:white;padding:13px;margin-top:8px;outline:none}.field textarea{min-height:120px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#111}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.opt{min-height:48px;border:1px solid #ddd;background:#fff;padding:10px;text-align:left}.opt.on{background:#111;color:#fff;border-color:#111}.nav{display:flex;gap:12px;padding:18px 0;position:sticky;bottom:0;background:#f6f6f3ee}.nav button{min-height:50px;border:1px solid #ccc;background:#fff;font-weight:800;flex:1}.nav .next{background:#111;color:#fff;border-color:#111;flex:1.6}.nav .finish{background:#ffd400;color:#111;border-color:#ffd400}.success{text-align:center;padding:80px 20px}.success h2{font-size:34px}.success button{border:0;background:#111;color:#fff;padding:14px 24px;font-weight:800}@media(max-width:640px){.choices,.grid{grid-template-columns:1fr}.options{grid-template-columns:1fr 1fr}.hero{padding-top:5vh}.panel{padding:20px}.logo{width:165px}}
  </style>
</head>
<body>
  <main id="home" class="wrap"><div class="top"><img class="logo" src="roundtable-logo.png" alt="设计青年圆桌派"><span class="tag">RESOURCE PROFILE</span></div><section class="hero"><div class="tag">设计青年圆桌派</div><h1>把彼此的资源，<br>变成共同的可能。</h1><p>建立设计师、设计机构、品牌与供应商的资源档案，为后续交流、合作与活动匹配提供基础。</p><div class="notice"><b>当前为流程测试版</b>：可以不填写内容直接点击下一步；本页面不会上传或保存测试资料。</div><div class="choices"><button class="choice" onclick="start('designer')"><b>设计师 / 设计机构</b><span>项目方向、合作需求与资源偏好</span></button><button class="choice" onclick="start('supplier')"><b>品牌 / 供应商</b><span>主营能力、服务区域与项目支持</span></button></div></section></main>
  <main id="form" class="form wrap"><div class="top"><button class="back" onclick="goHome()">← 返回首页</button><img class="logo" src="roundtable-logo.png" alt="设计青年圆桌派"></div><div class="head"><div><div class="tag">RESOURCE PROFILE</div><h1 id="formTitle"></h1></div><b id="count"></b></div><div class="progress"><div id="bar" class="bar"></div></div><section id="panel" class="panel"></section><div class="nav"><button id="prev" onclick="prev()">上一步</button><button id="next" class="next" onclick="next()">下一步 →</button></div></main>
  <script>
    let kind='designer',step=1;const total=5;
    const cats=['照明','家具','软装','材料','设备','施工配合','品牌策划','媒体传播','其他'];
    const projects=['餐饮空间','商业空间','办公空间','酒店民宿','住宅空间','文化展陈','城市更新','其他'];
    const pains=['客户从哪里来','报价与签约','项目管理','成本控制','材料供应','施工落地','团队建设','内容传播','跨界合作'];
    const input=t=>`<label class="field">${t}<input placeholder="选填"></label>`;
    const textarea=t=>`<label class="field">${t}<textarea placeholder="选填"></textarea></label>`;
    const select=(t,a)=>`<label class="field">${t}<select><option>请选择</option>${a.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
    const options=(t,a)=>`<div><h3>${t}</h3><div class="options">${a.map(x=>`<button class="opt" onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div></div>`;
    function start(k){kind=k;step=1;document.getElementById('home').style.display='none';document.getElementById('form').style.display='block';render();scrollTo(0,0)}
    function goHome(){document.getElementById('form').style.display='none';document.getElementById('home').style.display='block';scrollTo(0,0)}
    function prev(){if(step>1){step--;render();scrollTo(0,0)}}
    function next(){if(step<total){step++;render();scrollTo(0,0)}else success()}
    function render(){document.getElementById('formTitle').textContent=kind==='designer'?'设计师或设计机构资源登记':'品牌或供应商资源登记';document.getElementById('count').textContent=`${step} / ${total}`;document.getElementById('bar').style.width=`${step/total*100}%`;document.getElementById('prev').disabled=step===1;const n=document.getElementById('next');n.textContent=step===total?'完成体验':'下一步 →';n.className=step===total?'next finish':'next';document.getElementById('panel').innerHTML=content()}
    function content(){if(step===1)return `<h2>先认识一下</h2><div class="grid">${input('公司或机构名称')}${kind==='supplier'?input('品牌名称'):''}${input('填表人')}${input('职位')}${input('手机号')}${input('微信号')}${input('所在省份')}${input('所在城市')}</div>`;if(step===2)return kind==='designer'?`<h2>项目情况</h2>${options('主要项目类型',projects)}<br>${select('年项目量',['1至5个','6至10个','11至20个','21个以上'])}`:`<h2>企业身份与责任</h2><div class="grid">${select('企业身份',['厂家','品牌方','总代理','区域代理','经销商','服务商'])}${input('授权或代理区域')}${input('签约收款主体')}${input('供货或交付主体')}${input('售后责任主体')}</div>`;if(step===3)return kind==='designer'?`<h2>目前最想解决的问题</h2>${options('请选择关注的问题',pains)}`:`<h2>主营能力</h2>${options('主营品类',cats)}<br>${options('可以提供的支持',['样品','选品','报价','深化','技术支持','项目配合','售后','活动支持'])}`;if(step===4)return kind==='designer'?`<h2>材料合作概况</h2>${select('年度物料金额',['50万元以下','50至100万元','100至300万元','300万元以上','不方便透露'])}<br>${options('涉及品类',cats)}`:`<h2>项目与服务</h2>${options('主要项目类型',projects)}<br>${textarea('代表项目')}`;return `<h2>最后确认</h2>${textarea(kind==='designer'?'最希望平台提供哪些支持？':'对圆桌派合作有什么期待？')}<div class="notice">流程测试版不会保存本页内容。正式开放收集前，将再次确认隐私说明与数据接收方式。</div>`}
    function success(){document.getElementById('panel').innerHTML=`<div class="success"><h2>流程体验完成</h2><p>感谢参与测试。本次填写内容未上传、未保存。</p><button onclick="goHome()">返回首页</button></div>`;document.querySelector('.nav').style.display='none';setTimeout(()=>document.querySelector('.nav').style.display='flex',100)}
  </script>
</body>
</html>
